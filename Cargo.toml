[package]
name = "catnip-rs"
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
description = "A high-performance Rust CLI tool that concatenates project files into a single markdown document and applies regex-based code patches"
license = "Apache-2.0"
repository = "https://github.com/facorazza/catnip"
keywords = ["cli", "code", "patch", "markdown", "concatenate"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "catnip"
path = "src/lib.rs"

[[bin]]
name = "catnip"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
copypasta = "0.10.2"
regex = "1.13.1"
rustls = "0.23.43"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"